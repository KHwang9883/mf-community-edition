name: "release build"
on:
  workflow_dispatch:

# NOTE: If your `project.godot` is at the repository root, set `PROJECT_PATH` below to ".".

env:
  GODOT_VERSION: 4.4.1
  EXPORT_NAME: Mario Forever Community Edition
  PROJECT_PATH: .
  UPLOAD_FOLDER: MFCE-Builds/Release

jobs:
  export-release:
    name: Release Export
    runs-on: ubuntu-24.04  # Using 24.04 due to libgdmpt extension (for audio playback) failing on 22.04
    container:
      image: jue13/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set WINEPREFIX
        run: echo WINEPREFIX=/root/.wine >> "$GITHUB_ENV"
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Project Import
        run: |
          cd $PROJECT_PATH
          godot --headless --verbose --import
      - name: Windows x64 Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          echo 'start "" ".\${{ env.EXPORT_NAME }}.exe"' > "$EXPORT_DIR/windows/00. Launch in Recommended Mode.bat"
          echo 'start "" ".\${{ env.EXPORT_NAME }}.exe" --rendering-driver opengl3' > "$EXPORT_DIR/windows/01. Launch in Compatibility Mode.bat"
          echo 'start "" ".\${{ env.EXPORT_NAME }}.exe" --rendering-driver opengl3_angle' > "$EXPORT_DIR/windows/02. Launch in Compatibility Mode (angle).bat"
          echo 'start "" ".\${{ env.EXPORT_NAME }}.exe" --main-pack mfce-skin-editor.pck' > "$EXPORT_DIR/windows/Launch MFCE Skin Editor.bat"
          godot --headless --export-release "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"
      - name: Linux x64 Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          printf '#!/bin/bash\n\n"./${{ env.EXPORT_NAME }}.x86_64"' > "$EXPORT_DIR/linux/00. Launch in Recommended Mode.sh"
          printf '#!/bin/bash\n\n"./${{ env.EXPORT_NAME }}.x86_64" --rendering-driver opengl3' > "$EXPORT_DIR/linux/01. Launch in Compatibility Mode.sh"
          printf '#!/bin/bash\n\n"./${{ env.EXPORT_NAME }}.x86_64" --rendering-driver opengl3_angle' > "$EXPORT_DIR/linux/02. Launch in Compatibility Mode (angle).sh"
          printf '#!/bin/bash\n\n"./${{ env.EXPORT_NAME }}.x86_64" --main-pack mfce-skin-editor.pck' > "$EXPORT_DIR/linux/Launch MFCE Skin Editor.sh"
          chmod +x "$EXPORT_DIR/linux/00. Launch in Recommended Mode.sh"
          chmod +x "$EXPORT_DIR/linux/01. Launch in Compatibility Mode.sh"
          chmod +x "$EXPORT_DIR/linux/02. Launch in Compatibility Mode (angle).sh"
          godot --headless --export-release "Linux/X11" "$EXPORT_DIR/linux/$EXPORT_NAME.x86_64"
      - name: Checkout Skins
        uses: actions/checkout@v4
        with:
          repository: meteo-dream/bundled-mfce-skins
          path: bundled
      - name: Copy Skins
        run: |
          rm bundled/LICENSE
          cp -rv bundled/* build/windows
          cp -rv bundled/* build/linux
      - name: Prepare For Upload
        run: |
          EXPORT_DIR="$(readlink -f build)"
          echo "MFCE Release Build: [$(echo "${{ github.sha }}" | cut -c 1-7)](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) from $(date '+%d-%b-%Y %T')" > "$EXPORT_DIR/Readme.md"
          cd $EXPORT_DIR
          chmod +x "linux/${{ env.EXPORT_NAME }}.x86_64"
          zip -r windows64.zip windows
          rm -rf windows
          mkdir -v -p windows64
          split -b 80M windows64.zip windows64/part_ -d --verbose
          zip -r linux64.zip linux
          rm -rf linux
          mkdir -v -p linux64
          split -b 80M linux64.zip linux64/part_ -d --verbose
      - name: Upload Files
        run: |
          EXPORT_DIR="$(readlink -f build)"
          
          
          FILE_SIZE="$(wc -c < $EXPORT_DIR/windows64.zip)"
          FOLDER_UUID="$(cat /proc/sys/kernel/random/uuid)"
          rm -f $EXPORT_DIR/windows64.zip
          
          printf "File size: $FILE_SIZE\n"
          echo "Creating an upload folder: $FOLDER_UUID"
          curl -X MKCOL \
            -u ${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }} \
            ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/uploads/${{ secrets.NEXTCLOUD_USERNAME }}/$FOLDER_UUID \
            --header 'Destination: ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/GitHub-Uploads/${{ env.UPLOAD_FOLDER }}/windows-64.zip'
          
          LOOP_ID=0
          PART_ID=""
          for FILE in $EXPORT_DIR/windows64/part_*
          do
            LOOP_ID=$((LOOP_ID + 1))
            PART_ID=$(printf "%05d" "$LOOP_ID")
            echo "Uploading part $PART_ID: $FILE"
            curl -X PUT \
              -u ${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }} \
              ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/uploads/${{ secrets.NEXTCLOUD_USERNAME }}/$FOLDER_UUID/$PART_ID \
              --data-binary "@$FILE" \
              --header 'Destination: ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/GitHub-Uploads/${{ env.UPLOAD_FOLDER }}/windows-64.zip' \
              --header "OC-Total-Length: ${FILE_SIZE}"
          done
          
          echo "Assembling the chunks"
          curl -X MOVE \
            -u ${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }} \
            ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/uploads/${{ secrets.NEXTCLOUD_USERNAME }}/$FOLDER_UUID/.file \
            --header 'Destination: ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/GitHub-Uploads/${{ env.UPLOAD_FOLDER }}/windows-64.zip' \
            --header "OC-Total-Length: ${FILE_SIZE}"
          
          echo "Uploading file: $EXPORT_DIR/Readme.md"
          curl \
            -u ${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }} \
            -T "$EXPORT_DIR/Readme.md" \
            -g ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/GitHub-Uploads/${{ env.UPLOAD_FOLDER }}/
          
          
          
          FILE_SIZE="$(wc -c < $EXPORT_DIR/linux64.zip)"
          FOLDER_UUID="$(cat /proc/sys/kernel/random/uuid)"
          rm -f $EXPORT_DIR/linux64.zip
          
          printf "File size: $FILE_SIZE\n"
          echo "Creating an upload folder: $FOLDER_UUID"
          curl -X MKCOL \
            -u ${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }} \
            ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/uploads/${{ secrets.NEXTCLOUD_USERNAME }}/$FOLDER_UUID \
            --header 'Destination: ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/GitHub-Uploads/${{ env.UPLOAD_FOLDER }}/linux-64.zip'
          
          LOOP_ID=0
          PART_ID=""
          for FILE in $EXPORT_DIR/linux64/part_*
          do
            LOOP_ID=$((LOOP_ID + 1))
            PART_ID=$(printf "%05d" "$LOOP_ID")
            echo "Uploading part $PART_ID: $FILE"
            curl -X PUT \
              -u ${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }} \
              ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/uploads/${{ secrets.NEXTCLOUD_USERNAME }}/$FOLDER_UUID/$PART_ID \
              --data-binary "@$FILE" \
              --header 'Destination: ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/GitHub-Uploads/${{ env.UPLOAD_FOLDER }}/linux-64.zip' \
              --header "OC-Total-Length: ${FILE_SIZE}"
          done
          
          echo "Assembling the chunks"
          curl -X MOVE \
            -u ${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }} \
            ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/uploads/${{ secrets.NEXTCLOUD_USERNAME }}/$FOLDER_UUID/.file \
            --header 'Destination: ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/GitHub-Uploads/${{ env.UPLOAD_FOLDER }}/linux-64.zip' \
            --header "OC-Total-Length: ${FILE_SIZE}"
          
          echo "Uploading file: $EXPORT_DIR/Readme.md"
          curl \
            -u ${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }} \
            -T "$EXPORT_DIR/Readme.md" \
            -g ${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/GitHub-Uploads/${{ env.UPLOAD_FOLDER }}/

